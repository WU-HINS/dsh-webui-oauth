# dsh-webui-oauth 组合包层：安装本 bundle 时插入插件行。
#
# 注意：id 与包名一致。
#
# 与原版 dsh-webui-auth 的关系（重要）：本插件【不会】在运行时接管原版——两者
# 抢占同一批 webServer 路由，运行时无法安全共存（详见 index.js 顶部长注释与
# README「与原版的关系」的实测矩阵）。
#
# 因此装上本插件后，必须把原版从 profile 的 bundles 与 dependencies 中移除，
# 或在其补丁层写 disabled: true。若检测到原版仍启用，本插件会【拒绝启动】并
# 打印修复指令（fail-fast），以免出现"装好了却没生效"的静默失效。
- insert:
    - id: dsh-webui-oauth
      name: 'dsh-webui-oauth'
